services:
  rabbitmq:
    container_name: rabbitmq-container
    image: rabbitmq:3-management-alpine
    networks:
      - infra-network
    ports:
      - 5672:5672
      - 15672:15672
  redis:
    container_name: redis-container
    image: redis:alpine
    networks:
      - infra-network
    ports:
      - 6379:6379
  

networks:
  infra-network:
    
