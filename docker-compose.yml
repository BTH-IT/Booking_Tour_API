services:

  identity.api:
    image: identity-api
    build:
      context: .
      dockerfile: Services/Identity.API/Dockerfile
    networks:
      - apis-network
  room.api:
    image: room-api
    build:
      context: .
      dockerfile: Services/Room.API/Dockerfile
    networks:
      - apis-network
    depends_on:
      rabbitmq:
        condition: service_healthy
  tour.api:
    image: tour-api
    build:
      context: .
      dockerfile: Services/Tour.API/Dockerfile
    networks:
      - apis-network
    depends_on:
      rabbitmq:
        condition: service_healthy
  booking.api:
    image: booking-api
    build: 
      context: .
      dockerfile: Services/Booking.API/Dockerfile
    networks:
      - apis-network
    depends_on:
      rabbitmq:
        condition: service_healthy
  realtime.api:
    image: realtime-api
    build: 
      context: .
      dockerfile: Services/Realtime.API/Dockerfile
    networks:
      - apis-network
    depends_on:
      rabbitmq:
        condition: service_healthy
  rabbitmq:
    container_name: rabbitmq-container
    image: rabbitmq:3-management-alpine
    networks:
      - apis-network
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: "guest"
      RABBITMQ_DEFAULT_PASS: "guest"
      RABBITMQ_DEFAULT_VHOST: "booking"
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  upload.api:
    image: upload-api
    build:
        context: .
        dockerfile: Services/Upload.API/Dockerfile
    networks:
      - apis-network  

  api_gateway:
    image: api-gateway
    build:
      context: .
      dockerfile: ApiGateways/OcelotApiGw/Dockerfile
    depends_on:
      - identity.api
      - room.api
      - tour.api
      - booking.api
      - saga.api
      - realtime.api
    networks:
      - apis-network

  saga.api:
    image: saga-api
    build:
      context: .
      dockerfile: Saga.Orchestrator/Saga.Orchestrator/Dockerfile
    networks:
      - apis-network
    depends_on:
      rabbitmq:
        condition: service_healthy

  background.api:
    image: background-api
    build:
      context: .
      dockerfile: BackgroundJob/Hangfire.API/Dockerfile
    networks:
      - apis-network
    depends_on:
      rabbitmq:
        condition: service_healthy
  redis:
    container_name: redis-container
    image: redis:7.4.1
    networks:
      - apis-network
    ports:
      - 6379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.2
    networks:
      - apis-network
  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.2
    networks:
      - apis-network

volumes:
  elasticsearch_data:
    name: elasticsearch_data

networks:
  apis-network:
